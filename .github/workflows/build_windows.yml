name: build-windows-packages

# Scheduled runs sync this fork with its upstream, and build the Windows
# (x64) package only when the sync actually brought in new commits.
# Manual runs sync first, then always build. No release is published.
on:
  schedule:
    # Every 6 hours (UTC). The sync check itself is cheap; the Windows
    # build below is skipped when upstream has not changed.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-packages
  cancel-in-progress: false

env:
  # npm retries only transient registry fetches; deterministic install or
  # postinstall failures still fail immediately.
  NPM_CONFIG_FETCH_RETRIES: "4"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"

jobs:
  sync-upstream:
    name: sync-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - name: Sync fork with upstream and detect changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')"
          echo "main before sync: ${before}"
          # Syncs this fork's main with its upstream parent on GitHub's
          # side. Fails (and skips the build) if the branches have
          # diverged with conflicts; resolve those once by hand.
          gh repo sync "${{ github.repository }}" --branch main
          after="$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')"
          echo "main after sync: ${after}"
          if [[ "${after}" != "${before}" ]]; then
            echo "updated=true" >> "${GITHUB_OUTPUT}"
          else
            echo "updated=false" >> "${GITHUB_OUTPUT}"
          fi

  build-windows:
    name: build-windows
    needs: sync-upstream
    # Scheduled runs build only after a real upstream update; manual
    # runs always build.
    if: github.event_name == 'workflow_dispatch' || needs.sync-upstream.outputs.updated == 'true'
    runs-on: windows-latest
    env:
      VITE_SYNC_GITHUB_CLIENT_ID: ${{ secrets.VITE_SYNC_GITHUB_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_ID }}
      VITE_SYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_SYNC_GOOGLE_CLIENT_SECRET }}
      VITE_SYNC_ONEDRIVE_CLIENT_ID: ${{ secrets.VITE_SYNC_ONEDRIVE_CLIENT_ID }}
    steps:
      # Check out main explicitly, not the SHA that started this run, so
      # the build sees the commits the sync step just pulled in.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install deps
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          # These builds are not releases, so stamp a semver pre-release
          # form (`0.0.0-sha-<short-sha>`) that npm pkg / electron-builder
          # accept. Non-semver versions cause downstream tooling to error.
          # Take the SHA from the checked-out HEAD, not GITHUB_SHA: after a
          # sync, HEAD is newer than the commit that started this run.
          VERSION="0.0.0-sha-$(git rev-parse --short=7 HEAD)"
          echo "Setting version to ${VERSION}"
          npm pkg set version="${VERSION}"

      # Official Windows packages are x64-only for now. Bundled native
      # helpers are win32-x64, and the win target must not hard-code arm64
      # or the x64 job emits broken win-arm64 packages (#2570).
      - name: Build package
        env:
          ELECTRON_BUILDER_PUBLISH: "never"
        run: npm run pack:win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-windows
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore
